name: 01-pr-validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 01-check
    runs-on: ubuntu-latest
    steps:
      - name: 01-checkout
        uses: actions/checkout@v4

      - name: 02-setup-tooling
        uses: jdx/mise-action@d6e32c1796099e0f1f3ac741c220a8b7eae9e5dd
        with:
          install: true
          cache: true
          experimental: true
        env:
          # Required for aqua-backed tool installs to avoid GitHub API rate limits in CI.
          GITHUB_TOKEN: ${{ github.token }}

      - name: 03-install-dependencies
        run: mise run setup

      - name: 04-lint
        run: mise run lint

      - name: 05-test
        run: mise run test

      - name: 06-build
        run: mise run build
